name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@24
          cache: true

      - run: pnpm ci

      - name: Build the static demo
        run: pnpm --filter svalbard build

      - name: Skip Jekyll
        run: touch apps/svalbard/build/client/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/svalbard/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5