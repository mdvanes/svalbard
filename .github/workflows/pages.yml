name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # - uses: actions/setup-node@v7
      #   with:
      #     node-version: 24
      #     cache: npm

      - name: pnpm-setup
        uses: pnpm/action-setup@v6

      - run: pnpm ci

      # - run: pnpm test -w frontend

      - name: Build the static demo
        run: pnpm --filter svalbard build

      - name: Skip Jekyll
        run: touch apps/build/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4